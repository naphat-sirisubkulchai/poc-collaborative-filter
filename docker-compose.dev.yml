version: '3.8'

services:
  app:
    build:
      context: .
      target: development
    container_name: poc-collaborative-filter-dev
    ports:
      - "8080:8080"
    environment:
      - DB_DRIVER=postgres
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=collaborative_filter_dev
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      - GIN_MODE=debug
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/app
    networks:
      - poc-network
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: poc-postgres-dev
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=collaborative_filter_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    networks:
      - poc-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: poc-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    networks:
      - poc-network
    restart: unless-stopped

networks:
  poc-network:
    driver: bridge

volumes:
  postgres_dev_data:
  redis_dev_data:
